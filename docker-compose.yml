version: "3.8"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: ./airflow/dockerfiles/airflow.Dockerfile
  env_file:
    - .env
  environment:
    PYTHONPATH: /opt/airflow:/opt/airflow/src
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__WEBSERVER__WEB_SERVER_PORT: 8080
    AIRFLOW__WEBSERVER__SECRET_KEY: "tp-final-super-secret-please-change"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    # MLflow tracking para las tareas
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
    - ./src:/opt/airflow/src
  user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}"
  depends_on:
    - postgres
    - mlflow

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: >
      mlflow server
      --backend-store-uri /mlruns
      --default-artifact-root /mlruns
      --host 0.0.0.0
      --port 5000
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:/mlruns
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:5000\"); print(1)' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    entrypoint: ""
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    command: >
      bash -c "airflow db init &&
      airflow users create --role Admin --username admin --password admin --firstname Admin --lastname User --email admin@example.com"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      MODEL_PATH: /mnt/shared/models/model.joblib
    volumes:
      - ./data:/mnt/shared
    ports:
      - "8000:8000"
    depends_on:
      - airflow-webserver

volumes:
  pgdata:
